    <!--
      فونت وزیرمتن به‌صورت self-host سرو می‌شود، نه از Google Fonts.
      دلیل: fonts.googleapis.com از بیشتر ISPهای ایران در دسترس نیست؛ لینک خارجی
      render-blocking است و تا timeout شدن، متن فارسی با فونت fallback نمایش
      داده می‌شد و LCP هم چند ثانیه عقب می‌افتاد.
      فونت variable است (وزن ۱۰۰ تا ۹۰۰ در یک فایل) و با unicode-range فقط
      ساب‌ست موردنیاز دانلود می‌شود.
    -->
    <link rel="preload" href="/fonts/vazirmatn-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Vazirmatn';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/vazirmatn-arabic-wght-normal.woff2') format('woff2');
        unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC;
      }
      @font-face {
        font-family: 'Vazirmatn';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/vazirmatn-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Vazirmatn';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/vazirmatn-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* تا قبل از mount شدن اپ هم متن با فونت درست رندر شود */
      html, body {
        font-family: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
    </style>
